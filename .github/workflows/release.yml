name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.1)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}" -replace '^v', ''
          } else {
            $version = "0.0.0"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version: $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Generate application icon
        shell: pwsh
        run: ./tools/make-icon.ps1

      - name: Run checks
        shell: pwsh
        run: dotnet run --project ./tests/Darkenator.Tests/Darkenator.Tests.csproj -c Release

      - name: Publish self-contained app
        shell: pwsh
        run: ./build.ps1 -Version $env:APP_VERSION -SkipTests -SkipIcon

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
          }

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $output = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & $compiler "/DMyAppVersion=$env:APP_VERSION" "/O$output" "installer\Darkenator.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $hash = (Get-FileHash "release\Darkenator-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Darkenator-Setup.exe" | Set-Content "release\Darkenator-Setup.exe.sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Darkenator-${{ env.APP_VERSION }}-Windows-x64
          path: |
            release/Darkenator-Setup.exe
            release/Darkenator-Setup.exe.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Darkenator ${{ env.APP_VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/Darkenator-Setup.exe
            release/Darkenator-Setup.exe.sha256
